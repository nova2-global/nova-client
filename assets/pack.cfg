# Publisher defaults for pack.py. Paths are relative to this folder.
# Per-machine values (your key, your server) go in pack.local.cfg next to
# this file; it is git-ignored and overrides anything here. Every command
# line option still overrides both.
[paths]
staging = ../../staging
key = ../../keys/nova.key
# novapack = /path/to/novapack   ; default: next to pack.py, then PATH

[release]
channel = live
# Release ids are <prefix><number>; `build` picks the next number after the
# channel's current release (r4 -> r5). --release-id overrides.
prefix = r

[publish]
# rsync target of the server's share/patch directory (trailing slash added).
target = user@host:/srv/nova-server/share/patch
